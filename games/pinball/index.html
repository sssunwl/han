<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1024">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="彈珠台">
<link rel="manifest" href="/han/manifest.webmanifest">
<link rel="apple-touch-icon" href="/han/icon-192.png">
<title>彈珠台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    height:100%; overflow:hidden; overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent; position:fixed; inset:0;
  }
  @supports (height:100dvh) { html, body { height:100dvh; } }
  body {
    font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    background:#0d1024; color:#e8ecf5;
  }

  .screen { position:fixed; inset:0; display:none; }
  .screen.on { display:flex; }

  /* ---------- 選機台 ---------- */
  #selectScreen {
    flex-direction:column; overflow-y:auto; padding:
      calc(20px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom));
    background:radial-gradient(120% 80% at 50% 0%, #1b2350 0%, #0d1024 70%);
  }
  .wrap { width:100%; max-width:560px; margin:0 auto; }
  h1 { font-size:30px; letter-spacing:3px; text-align:center; }
  #who {
    display:inline-flex; align-items:center; gap:7px; margin:10px auto 22px;
    padding:5px 15px 5px 7px; border-radius:30px; background:rgba(255,255,255,.1); font-size:14px;
  }
  #who .face { font-size:20px; }
  .center { text-align:center; }
  h2 {
    font-size:12px; letter-spacing:4px; color:#8b93b5; margin:22px 0 12px; font-weight:normal;
  }

  #tableList { display:grid; gap:12px; }
  .tcard {
    display:flex; gap:14px; align-items:center; padding:12px;
    background:rgba(255,255,255,.06); border-radius:16px; cursor:pointer;
    border:2px solid transparent; transition:transform .12s, border-color .12s;
  }
  .tcard:hover { transform:translateY(-2px); border-color:rgba(255,255,255,.25); }
  .tcard.locked { opacity:.45; cursor:default; }
  .tcard.locked:hover { transform:none; border-color:transparent; }
  .tcard .art {
    width:66px; height:66px; border-radius:13px; flex:none;
    display:grid; place-items:center; font-size:30px;
  }
  .tcard h3 { font-size:18px; margin-bottom:3px; }
  .tcard p { font-size:12px; color:#9aa2c0; line-height:1.7; }
  .tcard .best { color:#ffd257; }
  .badge {
    font-size:10px; background:#3ecf7d; color:#06280f; border-radius:20px;
    padding:2px 8px; vertical-align:middle; margin-left:5px;
  }

  #boardTabs { display:flex; gap:7px; flex-wrap:wrap; margin-bottom:10px; }
  #boardTabs button {
    font:inherit; font-size:12px; padding:6px 12px; border-radius:20px; cursor:pointer;
    border:1px solid rgba(255,255,255,.2); background:transparent; color:#9aa2c0;
  }
  #boardTabs button.on { background:rgba(255,255,255,.16); color:#fff; }
  #board, #overBoard { background:rgba(255,255,255,.05); border-radius:14px; padding:6px; }
  .row {
    display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:10px; font-size:15px;
  }
  .row.me { background:rgba(255,210,87,.16); }
  .row .rank { width:18px; color:#8b93b5; font-size:13px; }
  .row .face { font-size:19px; }
  .row .nm { flex:1; }
  .row .sc { font-variant-numeric:tabular-nums; color:#ffd257; }
  .empty { padding:14px; text-align:center; color:#8b93b5; font-size:13px; }
  .back-link {
    display:block; text-align:center; margin-top:24px; color:#8b93b5;
    font-size:13px; text-decoration:none;
  }

  /* ---------- 遊戲 ---------- */
  #gameScreen { flex-direction:column; }
  #hud {
    display:flex; align-items:center; gap:10px; padding:
      calc(8px + env(safe-area-inset-top)) 12px 6px; flex:none;
  }
  #hud button {
    width:36px; height:36px; border-radius:11px; border:none; flex:none;
    background:rgba(255,255,255,.12); color:#fff; font-size:15px; font-family:inherit; cursor:pointer;
  }
  #fsBtn { display:none; }
  body.can-fullscreen #fsBtn { display:block; }
  #hudMid { flex:1; text-align:center; line-height:1.25; min-width:0; }
  #tableName { font-size:12px; color:#9aa2c0; }
  #score { font-size:26px; font-variant-numeric:tabular-nums; letter-spacing:1px; }
  #hudRight { text-align:right; font-size:12px; color:#9aa2c0; flex:none; }
  #balls { color:#ff6b9d; letter-spacing:2px; font-size:14px; }
  #mult { color:#ffd257; font-size:15px; }

  #goalBar { padding:0 14px 6px; flex:none; }
  #goalTrack { height:5px; border-radius:3px; background:rgba(255,255,255,.14); overflow:hidden; }
  #goalFill { height:100%; width:0; background:linear-gradient(90deg,#5de3ff,#ffd257); transition:width .2s; }
  #goalText { font-size:11px; color:#8b93b5; margin-top:4px; text-align:right; }

  #stage { flex:1; position:relative; min-height:0; }
  #game { position:absolute; inset:0; width:100%; height:100%; display:block; }
  .zone {
    position:absolute; top:0; bottom:0; width:50%; z-index:2;
    -webkit-tap-highlight-color:transparent;
  }
  #zoneL { left:0; } #zoneR { right:0; }
  #tip {
    position:absolute; left:0; right:0; bottom:10px; text-align:center;
    font-size:12px; color:rgba(255,255,255,.55); pointer-events:none; z-index:3;
  }

  /* ---------- 結束 ---------- */
  #overScreen {
    align-items:center; justify-content:center; background:rgba(9,11,26,.9); backdrop-filter:blur(5px);
    padding:20px;
  }
  #overCard {
    background:#161b3a; border-radius:22px; padding:26px 26px 22px; width:100%; max-width:380px;
    max-height:100%; overflow-y:auto; text-align:center;
  }
  #overTitle { font-size:26px; margin-bottom:4px; }
  #overTitle.pass { color:#3ecf7d; }
  #overScore { font-size:44px; font-variant-numeric:tabular-nums; margin:6px 0; }
  #overGoal { font-size:13px; color:#9aa2c0; margin-bottom:18px; }
  #overCard h2 { margin-top:6px; }
  .btnrow { display:flex; gap:10px; margin-top:20px; }
  .btn {
    flex:1; font:inherit; font-size:16px; font-weight:bold; padding:12px; border:none;
    border-radius:13px; background:#4c7dff; color:#fff; cursor:pointer;
  }
  .btn.ghost { background:rgba(255,255,255,.12); }
</style>
</head>
<body>

  <div class="screen on" id="selectScreen">
    <div class="wrap">
      <h1>彈 珠 台</h1>
      <div class="center"><span id="who"></span></div>

      <h2>選 機 台</h2>
      <div id="tableList"></div>

      <h2>排 行 榜</h2>
      <div id="boardTabs"></div>
      <div id="board"></div>

      <a class="back-link" href="../../">← 回遊戲間換人</a>
    </div>
  </div>

  <div class="screen" id="gameScreen">
    <div id="hud">
      <button id="backBtn" title="回選單">✕</button>
      <button id="fsBtn" title="全螢幕">⛶</button>
      <div id="hudMid">
        <div id="tableName"></div>
        <div id="score">0</div>
      </div>
      <div id="hudRight">
        <div id="balls">●●●</div>
        <div id="mult">×1</div>
      </div>
    </div>
    <div id="goalBar">
      <div id="goalTrack"><div id="goalFill"></div></div>
      <div id="goalText">過關 <span id="goalNow">0</span> / <span id="goalTarget">0</span></div>
    </div>
    <div id="stage">
      <canvas id="game"></canvas>
      <div class="zone" id="zoneL"></div>
      <div class="zone" id="zoneR"></div>
      <div id="tip">按住畫面蓄力發球 · 左右兩邊分別控制左右擋板</div>
    </div>
  </div>

  <div class="screen" id="overScreen">
    <div id="overCard">
      <div id="overTitle">結束</div>
      <div id="overScore">0</div>
      <div id="overGoal"></div>
      <h2>這 台 的 排 行</h2>
      <div id="overBoard"></div>
      <div class="btnrow">
        <button class="btn ghost" id="toSelectBtn">換機台</button>
        <button class="btn" id="retryBtn">再玩一次</button>
      </div>
      <div class="btnrow">
        <button class="btn" id="nextBtn" style="display:none">下一台 →</button>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
