<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14204a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="溫泉旅館">
<link rel="manifest" href="/han/manifest.webmanifest">
<link rel="apple-touch-icon" href="/han/icon-192.png">
<title>溫泉旅館</title>
<link rel="stylesheet" href="../../shared/food.css">
<style>
  /* 介面走開羅系經營遊戲的感覺:深藍底、亮邊框的像素面板 */
  :root { --accent:#e8603c; --bg:#14204a; --card:#fff8ee;
          --pn:#1d3577; --pn2:#14204a; --edge:#7fd3ff; --gold:#ffd84a; }
  .start { background:radial-gradient(120% 80% at 50% 0%, #2d5a8a 0%, #14204a 75%); }
  .credit { font-size:11px; color:var(--dim); margin-top:10px; line-height:1.6; }
  #oldNote { font-size:12px; color:#c0573a; margin-top:8px; }

  /* 像素面板 */
  .px {
    background:linear-gradient(180deg, var(--pn), var(--pn2));
    border:3px solid var(--edge); border-radius:6px;
    box-shadow:0 0 0 2px #0b1230, inset 0 2px 0 rgba(255,255,255,.15);
    color:#fff;
  }

  #gameScreen { flex-direction:column; background:#0b1230; color:#fff; }
  .bar {
    display:flex; align-items:center; gap:6px; flex:none; position:relative; z-index:3; flex-wrap:wrap;
    padding:calc(4px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 4px calc(8px + env(safe-area-inset-left));
  }
  .bar .box { padding:3px 8px; line-height:1.2; }
  .bar .icon { width:34px; height:34px; border-radius:6px; border:2px solid var(--edge); background:var(--pn); color:#fff; font-size:14px; cursor:pointer; flex:none; }
  #dayBox { text-align:center; }
  #day { font-size:12px; color:#cfe7ff; white-space:nowrap; }
  #clock { font-size:14px; font-weight:bold; color:var(--gold); font-variant-numeric:tabular-nums; }
  #moneyBox { margin-left:auto; text-align:right; }
  #money { font-weight:bold; color:#fff; font-variant-numeric:tabular-nums; font-size:17px; }
  #ideas { font-size:12px; color:#bfe8ff; }
  .rankbox { text-align:right; }
  #rank { color:var(--gold); letter-spacing:1px; font-size:12px; }
  #nation { font-size:11px; color:#cfe7ff; }
  #repTrack { width:72px; height:4px; background:rgba(255,255,255,.2); border-radius:2px; overflow:hidden; margin-left:auto; }
  #repFill { height:100%; width:0; background:var(--gold); }
  .speeds { display:flex; gap:3px; }
  .speeds button { width:30px; height:28px; border:2px solid var(--edge); border-radius:6px; background:var(--pn); color:#fff; font-size:10px; cursor:pointer; }
  .speeds button.on { background:var(--accent); }

  /* 收起來的面板不要露出來;clip 比 hidden 嚴格,程式 scrollIntoView 也捲不動 */
  .stage { flex:1; position:relative; min-height:0; overflow:hidden; overflow:clip; }
  /* canvas 一定壓在最底層 */
  #cv { position:absolute; inset:0; width:100%; height:100%; display:block; z-index:0; touch-action:none; image-rendering:pixelated; }
  .zoom { position:absolute; right:calc(8px + env(safe-area-inset-right)); top:8px; z-index:2; display:flex; flex-direction:column; gap:6px; }
  .zoom button { width:36px; height:36px; font-size:18px; cursor:pointer; }

  #toast {
    position:absolute; left:50%; top:8px; transform:translate(-50%,-8px); z-index:5; opacity:0;
    padding:7px 14px; font-size:14px; max-width:86%; text-align:center; pointer-events:none;
    transition:opacity .25s, transform .25s;
  }
  #toast.on { opacity:1; transform:translate(-50%,0); }

  /* 工具列 */
  .tools2 {
    flex:none; display:flex; gap:5px; justify-content:center; position:relative; z-index:3; overflow-x:auto;
    padding:5px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
  }
  .tools2 button {
    flex:1 1 0; max-width:96px; min-width:44px; padding:5px 2px; cursor:pointer; font:inherit;
    display:flex; flex-direction:column; align-items:center; gap:1px;
  }
  .tools2 .ic { font-size:20px; line-height:1.1; }
  .tools2 .lb { font-size:11px; font-weight:bold; }
  .tools2 button:active { transform:translateY(2px); }

  /* 選單抽屜 */
  #sheet {
    position:absolute; left:50%; bottom:8px; z-index:4; width:min(560px, calc(100% - 16px));
    max-height:calc(100% - 16px); display:flex; flex-direction:column;
    transform:translate(-50%, 120%); transition:transform .22s;
  }
  #sheet.on { transform:translate(-50%, 0); }
  #sheet .hd { display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:2px solid rgba(127,211,255,.4); }
  #sheetTitle { flex:1; font-weight:bold; font-size:14px; }
  #sheetClose { width:30px; height:30px; border-radius:6px; border:2px solid var(--edge); background:transparent; color:#fff; cursor:pointer; }
  #sheetBody { overflow-y:auto; padding:6px; touch-action:pan-y; }
  .item {
    width:100%; display:flex; align-items:center; gap:10px; padding:7px 8px; margin-bottom:5px; text-align:left;
    background:rgba(255,255,255,.07); border:2px solid rgba(127,211,255,.35); border-radius:6px; color:#fff; font:inherit; cursor:pointer;
  }
  .item:not(:disabled):hover { border-color:var(--gold); background:rgba(255,216,74,.12); }
  .item:disabled { opacity:.5; cursor:default; }
  .item.dim { opacity:.6; }
  .item .ic { font-size:24px; width:40px; display:grid; place-items:center; flex:none; min-height:32px; overflow:hidden; }
  .item .pic { display:block; background-repeat:no-repeat; image-rendering:pixelated; transform:scale(.8); transform-origin:center; }
  .item .tx { flex:1; min-width:0; display:flex; flex-direction:column; }
  .item b { font-size:14px; }
  .item small { font-size:11px; color:#bcd3f5; line-height:1.4; }
  .item .sz { font-size:10px; color:#9fb7e0; font-weight:normal; }
  .item .pr { font-weight:bold; color:var(--gold); font-size:13px; white-space:nowrap; }
  .note { font-size:12px; color:#cfe7ff; line-height:1.6; padding:4px 6px 8px; }

  /* 擺放 / 買地確認列 */
  #placeBar {
    position:absolute; left:50%; bottom:8px; z-index:4; width:min(520px, calc(100% - 16px));
    display:flex; align-items:center; gap:8px; padding:8px 10px;
    transform:translate(-50%, 140%); transition:transform .2s;
  }
  #placeBar.on { transform:translate(-50%, 0); }
  #pbText { flex:1; font-size:13px; line-height:1.4; }
  #placeBar button { font:inherit; font-weight:bold; font-size:14px; padding:9px 12px; border-radius:6px; cursor:pointer; border:2px solid var(--edge); color:#fff; white-space:nowrap; }
  #pbOk { background:#2f9e5b; } #pbOk:disabled { background:#55607a; opacity:.7; cursor:default; }
  #pbCancel { background:transparent; }

  /* 設施面板 */
  #panel {
    position:absolute; left:50%; bottom:8px; z-index:4; transform:translate(-50%, 140%); transition:transform .22s;
    width:min(440px, calc(100% - 16px)); padding:10px 12px;
  }
  #panel.on { transform:translate(-50%, 0); }
  #panel .top { display:flex; align-items:center; gap:10px; }
  #pIcon { font-size:26px; }
  #pName { font-weight:bold; font-size:16px; flex:1; }
  #pClose { border:2px solid var(--edge); background:transparent; color:#fff; width:30px; height:30px; border-radius:6px; cursor:pointer; }
  #pDesc { font-size:12px; color:#bcd3f5; margin:5px 0 3px; line-height:1.5; }
  #pStat { font-size:12px; color:#9dffbf; margin-bottom:8px; min-height:1em; line-height:1.5; }
  .pbtns { display:flex; gap:8px; }
  .pbtns button { flex:1; font:inherit; font-weight:bold; font-size:14px; padding:9px; border-radius:6px; border:2px solid var(--edge); color:#fff; cursor:pointer; }
  #pBtn { background:var(--accent); } #pBtn:disabled { background:#55607a; opacity:.7; cursor:default; }
  #pSell { background:transparent; flex:0 0 auto; font-size:12px; }

  /* 手機橫放(矮螢幕):面板、選單靠右,不擋地圖 */
  @media (orientation:landscape) and (max-height:540px) {
    #panel, #sheet, #placeBar { left:auto; right:calc(52px + env(safe-area-inset-right)); width:340px; transform:translateX(130%); }
    #panel.on, #sheet.on, #placeBar.on { transform:none; }
    .tools2 button { padding:3px 2px; }
    .tools2 .ic { font-size:17px; }
  }
  /* 直式手機:資訊列擠一點 */
  @media (max-width:560px) {
    .tools2 { gap:3px; padding-left:4px; padding-right:4px; }
    .tools2 .ic { font-size:18px; }
    .bar .box { padding:2px 6px; }
    #money { font-size:15px; }
    .tools2 .lb { font-size:10px; }
  }

  /* 一天結算 */
  #summary { position:fixed; inset:0; z-index:6; display:none; align-items:center; justify-content:center; padding:14px; background:rgba(5,10,30,.6); }
  #summary.on { display:flex; }
  #summary .card { max-height:100%; overflow-y:auto; touch-action:pan-y; }
  .nums { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:10px 0 6px; }
  .nums div { background:rgba(0,0,0,.05); border-radius:10px; padding:7px 4px; }
  .nums b { display:block; font-size:17px; }
  .nums span { font-size:11px; color:var(--dim); }
  #sTurned { font-size:12px; color:#c0573a; min-height:1em; }
  .year { margin:8px 0; padding:10px; border-radius:12px; background:linear-gradient(135deg,#fff3c4,#ffd98a); color:#5a3a00; font-size:14px; }
  .review { text-align:left; background:rgba(0,0,0,.04); border-radius:12px; padding:7px 10px; margin-top:6px; font-size:13px; line-height:1.6; }
  .rs { color:#e8a317; margin-right:4px; }
  .rw { display:block; font-size:11px; color:var(--dim); }
  #sRep { font-size:12px; color:var(--dim); margin:10px 0 4px; }
</style>
</head>
<body>

  <div class="screen start on" id="startScreen">
    <div class="card">
      <div class="big">♨️</div>
      <h1>溫泉旅館</h1>
      <div class="who" id="who"></div>
      <p class="how">
        你是旅館老闆!在自己的土地上<b>自由蓋</b>和室、浴場、露天風呂…<br>
        客人留好評就會升星;用客人給的 <b>💡 靈感</b> 研究新設施,<br>
        <b>買地擴建</b>、請員工、打廣告,擺出<b>組合</b>,目標<b>全國第一</b>!
        <br><span style="font-size:13px">點設施可以升級;手指拖曳移動畫面、兩指縮放。</span>
      </p>
      <button class="btn wide" id="startBtn">開一間溫泉旅館!</button>
      <div class="btnrow"><button class="btn ghost" id="newBtn" style="display:none">重新開一間</button></div>
      <div id="oldNote" style="display:none">新版改成自由建造,舊版的旅館沒辦法搬過來,要重新開一間。</div>
      <a class="back-link" href="../../">← 回遊戲間換人</a>
      <p class="credit">像素美術:LimeZu — Modern Interiors(limezu.itch.io)</p>
    </div>
  </div>

  <div class="screen" id="gameScreen">
    <div class="bar">
      <button class="icon" id="backBtn" title="存檔並回開始畫面">✕</button>
      <div class="box px" id="dayBox"><div id="day"></div><div id="clock"></div></div>
      <div class="speeds">
        <button data-speed="0" title="暫停">⏸</button>
        <button data-speed="1" class="on" title="1 倍速">▶</button>
        <button data-speed="2" title="2 倍速">▶▶</button>
        <button data-speed="4" title="4 倍速">⏩</button>
      </div>
      <div class="box px" id="moneyBox"><div id="money">¥0</div><div id="ideas">💡0</div></div>
      <div class="box px rankbox"><div id="rank"></div><div id="nation"></div><div id="repTrack"><div id="repFill"></div></div></div>
    </div>
    <div class="stage">
      <canvas id="cv"></canvas>
      <div class="zoom"><button class="px" id="zIn" title="放大">＋</button><button class="px" id="zOut" title="縮小">－</button></div>
      <div id="toast" class="px"></div>

      <div id="sheet" class="px">
        <div class="hd"><span id="sheetTitle"></span><button id="sheetClose">✕</button></div>
        <div id="sheetBody"></div>
      </div>

      <div id="placeBar" class="px">
        <span id="pbText"></span>
        <button id="pbCancel">取消</button>
        <button id="pbOk">✔ 蓋在這裡</button>
      </div>

      <div id="panel" class="px">
        <div class="top"><span id="pIcon"></span><span id="pName"></span><button id="pClose">✕</button></div>
        <div id="pDesc"></div>
        <div id="pStat"></div>
        <div class="pbtns"><button id="pBtn">升級</button><button id="pSell">拆除</button></div>
      </div>
    </div>
    <div class="tools2">
      <button class="px" id="tBuild"><span class="ic">🔨</span><span class="lb">建造</span></button>
      <button class="px" id="tDecor"><span class="ic">🌿</span><span class="lb">擺設</span></button>
      <button class="px" id="tLand"><span class="ic">🗺</span><span class="lb">買地</span></button>
      <button class="px" id="tResearch"><span class="ic">💡</span><span class="lb">研究</span></button>
      <button class="px" id="tStaff"><span class="ic">👥</span><span class="lb">員工</span></button>
      <button class="px" id="tAds"><span class="ic">📣</span><span class="lb">宣傳</span></button>
      <button class="px" id="tBook"><span class="ic">📖</span><span class="lb">圖鑑</span></button>
    </div>
  </div>

  <div id="summary">
    <div class="card">
      <h1 id="sTitle" style="font-size:22px">第 1 天結束</h1>
      <div class="nums">
        <div><b id="sIncome">¥0</b><span>今日收入</span></div>
        <div><b id="sSalary">-¥0</b><span>員工薪水</span></div>
        <div><b id="sIdeas">💡+0</b><span>靈感</span></div>
        <div><b id="sServed">0</b><span>退房客人</span></div>
        <div style="grid-column:span 2"><b id="sAvg">—</b><span>平均評價</span></div>
      </div>
      <div id="sTurned"></div>
      <div id="sYear"></div>
      <div id="sReviews"></div>
      <div id="sRep"></div>
      <button class="btn wide" id="sNext">下一天 →</button>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
