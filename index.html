<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#9fd8f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="遊戲間">
<link rel="manifest" href="/han/manifest.webmanifest">
<link rel="apple-touch-icon" href="/han/icon-192.png">
<link rel="icon" href="/han/icon-192.png">
<title>遊戲間</title>
<style>
  :root {
    --ink:#2c3140; --dim:#7b8398; --line:#e3e7f0; --card:#fff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
    color:var(--ink); min-height:100vh; padding:32px 20px 60px;
    background:linear-gradient(160deg,#eaf4ff 0%,#f7f2ff 55%,#fff6ea 100%);
  }
  .wrap { max-width:820px; margin:0 auto; }

  header { text-align:center; margin-bottom:34px; }
  header h1 { font-size:38px; letter-spacing:2px; }
  header p { color:var(--dim); margin-top:6px; font-size:15px; }

  section { margin-bottom:36px; }
  h2 {
    font-size:14px; letter-spacing:4px; color:var(--dim);
    margin-bottom:14px; font-weight:normal;
  }

  /* ---- 選自己是誰 ---- */
  #players { display:flex; flex-wrap:wrap; gap:12px; }
  .player {
    display:flex; flex-direction:column; align-items:center; gap:6px;
    width:96px; padding:14px 6px; border-radius:18px; cursor:pointer;
    background:var(--card); border:3px solid transparent;
    box-shadow:0 3px 10px rgba(40,50,80,.07); transition:transform .12s, border-color .12s;
    position:relative;
  }
  .player:hover { transform:translateY(-3px); }
  .player.on { border-color:currentColor; }
  .player .face {
    width:56px; height:56px; border-radius:50%; display:grid; place-items:center;
    font-size:30px; background:#f1f4fa;
  }
  .player .nm { font-size:15px; font-weight:bold; color:var(--ink); }
  .player .del {
    position:absolute; top:4px; right:8px; font-size:15px; color:#c9ceda;
    display:none; line-height:1;
  }
  .player:hover .del { display:block; }
  .player.add { border:3px dashed var(--line); box-shadow:none; color:var(--dim); }
  .player.add .face { background:transparent; font-size:34px; color:var(--dim); }

  /* ---- 新增玩家 ---- */
  #newBox { display:none; margin-top:14px; padding:18px; border-radius:18px; background:var(--card);
            box-shadow:0 3px 10px rgba(40,50,80,.07); }
  #newBox.open { display:block; }
  #newBox label { font-size:13px; color:var(--dim); display:block; margin-bottom:8px; }
  #newName {
    font:inherit; font-size:18px; padding:10px 14px; border:2px solid var(--line);
    border-radius:12px; width:190px; outline:none;
  }
  #newName:focus { border-color:#7aa7ff; }
  .picker { display:flex; flex-wrap:wrap; gap:8px; margin:14px 0; }
  .picker button {
    font-size:24px; width:46px; height:46px; border-radius:12px; cursor:pointer;
    border:3px solid transparent; background:#f1f4fa;
  }
  .picker button.on { border-color:#7aa7ff; }
  .btn {
    font:inherit; font-size:16px; font-weight:bold; padding:11px 26px; border:none;
    border-radius:12px; background:#4c7dff; color:#fff; cursor:pointer;
  }
  .btn.ghost { background:transparent; color:var(--dim); font-weight:normal; }

  /* ---- 遊戲清單 ---- */
  #games { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; }
  .game {
    border-radius:20px; overflow:hidden; background:var(--card); cursor:pointer;
    box-shadow:0 4px 14px rgba(40,50,80,.09); transition:transform .14s, box-shadow .14s;
    display:block; text-decoration:none; color:inherit;
  }
  .game:hover { transform:translateY(-4px); box-shadow:0 10px 24px rgba(40,50,80,.14); }
  .game .art { height:118px; display:grid; place-items:center; font-size:46px; }
  .game .body { padding:14px 16px 18px; }
  .game h3 { font-size:19px; margin-bottom:5px; }
  .game p { font-size:13px; color:var(--dim); line-height:1.6; }
  .game.soon { opacity:.55; cursor:default; }
  .game.soon:hover { transform:none; box-shadow:0 4px 14px rgba(40,50,80,.09); }
  .tag {
    display:inline-block; font-size:11px; padding:3px 9px; border-radius:20px;
    background:#eef2fb; color:var(--dim); margin-top:9px;
  }
  .tip {
    display:flex; gap:14px; align-items:flex-start; padding:16px 18px;
    border-radius:18px; background:var(--card); box-shadow:0 3px 10px rgba(40,50,80,.07);
  }
  .tip-icon { font-size:30px; line-height:1.2; }
  .tip b { display:block; margin-bottom:5px; }
  .tip p { font-size:13px; color:var(--dim); line-height:1.85; }
  footer { text-align:center; color:var(--dim); font-size:12px; line-height:1.9; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>遊戲間</h1>
      <p>先選自己是誰，紀錄會分開存</p>
    </header>

    <section>
      <h2>你 是 誰</h2>
      <div id="players"></div>
      <div id="newBox">
        <label>名字</label>
        <input id="newName" maxlength="12" placeholder="輸入名字">
        <div class="picker" id="avatarPicker"></div>
        <button class="btn" id="createBtn">建立</button>
        <button class="btn ghost" id="cancelBtn">取消</button>
      </div>
    </section>

    <section>
      <h2>選 遊 戲</h2>
      <div id="games">
        <a class="game" href="games/kidcraft/">
          <div class="art" style="background:linear-gradient(150deg,#9fd8f5,#c8e6a0)">🧱</div>
          <div class="body">
            <h3>方塊世界</h3>
            <p>挖方塊、蓋房子，想做什麼都可以。跟著任務走就會玩了。</p>
            <span class="tag">7 個任務 · 不會死掉</span>
          </div>
        </a>
        <div class="game soon">
          <div class="art" style="background:linear-gradient(150deg,#ffd9a0,#ffb3c8)">🎲</div>
          <div class="body">
            <h3>下一個遊戲</h3>
            <p>還沒做好。</p>
            <span class="tag">敬請期待</span>
          </div>
        </div>
      </div>
    </section>

    <section id="a2hs" style="display:none">
      <h2>手 機 玩 法</h2>
      <div class="tip">
        <div class="tip-icon">📲</div>
        <div>
          <b id="a2hsTitle">把它加到主畫面</b>
          <p id="a2hsSteps"></p>
        </div>
      </div>
    </section>

    <footer>
      紀錄只存在這台裝置上，沒有帳號、沒有密碼、不會上傳到任何地方。<br>
      換一台電腦或清除瀏覽器資料，作品就會不見。
    </footer>
  </div>

  <script type="module" src="./lobby.js"></script>
</body>
</html>
